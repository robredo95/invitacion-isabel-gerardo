<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nuestra boda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Corinthia:wght@400;700&family=Cinzel:wght@400;500;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="flour" viewBox="0 0 150 22"><g fill="none" stroke="currentColor" stroke-width=".9"><path d="M4 11h52M94 11h52"/><path d="M75 4c-6 0-9 4-9 7s3 7 9 7 9-4 9-7-3-7-9-7zM66 11c-4-4-8-4-10 0M84 11c4-4 8-4 10 0"/></g><circle cx="75" cy="11" r="1.8" fill="currentColor"/></symbol>
    <symbol id="i-ring" viewBox="0 0 40 40"><g fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="15" cy="23" r="9"/><circle cx="25" cy="23" r="9"/><path d="M21 9l4-4 4 4-4 4z"/></g></symbol>
    <symbol id="i-glass" viewBox="0 0 40 40"><g fill="none" stroke="currentColor" stroke-width="1.3"><path d="M9 6h9l-1 10a3.5 3.5 0 01-7 0zM13.5 20v12M9 32h9M22 6h9l-1 10a3.5 3.5 0 01-7 0zM26.5 20v12M22 32h9"/></g></symbol>
    <symbol id="i-plate" viewBox="0 0 40 40"><g fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="20" cy="20" r="11"/><circle cx="20" cy="20" r="7"/><path d="M5 8v8a2 2 0 002 2v14M5 8v6M7 8v6M35 8c-3 2-3 7 0 10v14"/></g></symbol>
    <symbol id="i-music" viewBox="0 0 40 40"><g fill="none" stroke="currentColor" stroke-width="1.3"><path d="M15 29V9l17-4v20"/><circle cx="11" cy="29" r="4"/><circle cx="28" cy="25" r="4"/></g></symbol>
    <symbol id="i-cake" viewBox="0 0 40 40"><g fill="none" stroke="currentColor" stroke-width="1.3"><path d="M8 33h24M10 33V24h20v9M13 24v-6h14v6M17 18v-5h6v5M20 13V9"/><path d="M20 9c-2-2 0-4 0-4s2 2 0 4z"/></g></symbol>
    <symbol id="i-moon" viewBox="0 0 40 40"><g fill="none" stroke="currentColor" stroke-width="1.3"><path d="M26 30A12 12 0 0114 10a12 12 0 1012 20z"/><path d="M29 9l1 2 2 1-2 1-1 2-1-2-2-1 2-1z"/></g></symbol>
    <symbol id="i-clock" viewBox="0 0 40 40"><g fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="20" cy="20" r="13"/><path d="M20 12v8l6 4"/></g></symbol>
    <symbol id="i-car" viewBox="0 0 40 40"><g fill="none" stroke="currentColor" stroke-width="1.3"><path d="M7 26v-6l4-8h18l4 8v6zM7 20h26"/><circle cx="13" cy="27" r="3"/><circle cx="27" cy="27" r="3"/></g></symbol>
    <symbol id="i-sun" viewBox="0 0 40 40"><g fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="20" cy="20" r="6"/><path d="M20 6v4M20 30v4M6 20h4M30 20h4M10 10l3 3M27 27l3 3M30 10l-3 3M13 27l-3 3"/></g></symbol>
    <symbol id="i-bed" viewBox="0 0 40 40"><g fill="none" stroke="currentColor" stroke-width="1.3"><path d="M6 30V12M6 24h28v6M34 24v-5a4 4 0 00-4-4H18v9"/><circle cx="12" cy="19" r="3"/></g></symbol>
    <symbol id="i-env" viewBox="0 0 40 40"><g fill="none" stroke="currentColor" stroke-width="1.3"><rect x="6" y="11" width="28" height="19" rx="2"/><path d="M6 12l14 10 14-10"/></g></symbol>
    <symbol id="i-bank" viewBox="0 0 40 40"><g fill="none" stroke="currentColor" stroke-width="1.3"><path d="M6 15l14-8 14 8zM9 15v12M16 15v12M24 15v12M31 15v12M6 31h28"/></g></symbol>
    <symbol id="i-gift" viewBox="0 0 40 40"><g fill="none" stroke="currentColor" stroke-width="1.3"><rect x="7" y="16" width="26" height="17" rx="1"/><path d="M5 11h30v5H5zM20 11v22M20 11c-3-6-10-6-9-1M20 11c3-6 10-6 9-1"/></g></symbol>
    <symbol id="i-cam" viewBox="0 0 40 40"><g fill="none" stroke="currentColor" stroke-width="1.3"><rect x="5" y="12" width="30" height="20" rx="3"/><circle cx="20" cy="22" r="6"/><path d="M14 12l2-4h8l2 4"/></g></symbol>
    <symbol id="i-album" viewBox="0 0 40 40"><g fill="none" stroke="currentColor" stroke-width="1.3"><rect x="12" y="5" width="16" height="30" rx="3"/><rect x="4" y="12" width="12" height="15" rx="1" transform="rotate(-10 10 19)"/><rect x="24" y="12" width="12" height="15" rx="1" transform="rotate(10 30 19)"/></g></symbol>
  </defs>
</svg>

<div id="lang" role="group" aria-label="Idioma / Language"><button data-l="es" aria-pressed="true">ES</button><button data-l="en" aria-pressed="false">EN</button></div>

<div id="sobre" role="dialog" aria-label="Invitación">
  <div class="env" id="sobreEnv">
    <div class="back"></div>
    <div class="letter"><div><span class="cz" style="font-size:10px;color:#8c705c" data-i="nosCasamos"></span><br><span class="script" id="letterNames"></span></div></div>
    <svg class="pocket" viewBox="0 0 440 303" preserveAspectRatio="none" aria-hidden="true" style="z-index:3"><path d="M0 303V40l205 140h30L440 40v263z" fill="#e6d8c0"/><path d="M0 40l205 140h30L440 40" fill="none" stroke="#c8b8a0"/></svg>
    <svg class="flap" viewBox="0 0 440 190" preserveAspectRatio="none" aria-hidden="true"><path d="M0 0h440L240 182q-20 12-40 0z" fill="#ddcdb4" stroke="#c8b8a0"/></svg>
    <svg class="seal" viewBox="0 0 92 92" aria-hidden="true"><defs><clipPath id="sc"><path id="sp" d="M46 4c8 0 10 5 16 6s11 1 14 8-1 10 2 16 7 8 7 12-4 7-7 12 1 11-2 16-8 6-14 8-8 6-16 6-10-5-16-6-11-1-14-8 1-11-2-16-7-8-7-12 4-7 7-12-1-10 2-16 8-6 14-8 8-6 16-6z"/></clipPath><radialGradient id="sg" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#a9b5a5"/><stop offset=".6" stop-color="#8a9886"/><stop offset="1" stop-color="#6c7a6a"/></radialGradient></defs><use href="#sp" fill="url(#sg)"/><circle cx="46" cy="46" r="29" fill="none" stroke="#5f6c5d" stroke-width="1.5"/><circle cx="46" cy="46" r="25" fill="none" stroke="#c3cdbf" stroke-width=".6" opacity=".7"/><text id="sealTxt" x="46" y="56" text-anchor="middle" font-family="Corinthia" font-size="34" fill="#f7f2ec"></text><g clip-path="url(#sc)"><rect class="shine" x="30" y="-10" width="14" height="112" fill="#fff" transform="rotate(20 46 46)"/></g></svg>
    <div class="sobre-txt"><p id="sobreGuest"></p><span class="cz hint" data-i="tocaSello"></span><button class="btn" id="abrir" data-i="abrir"></button></div>
  </div>
</div>

<canvas id="petals" aria-hidden="true"></canvas>
<button id="musica" aria-label="Música"><span class="eq"><i></i><i></i><i></i><i></i></span></button>
<audio id="audio" loop preload="none"></audio>
<div id="lb" role="dialog" aria-modal="true" aria-label="Foto"><img id="lbImg" alt=""><button id="lbX" aria-label="Cerrar">×</button><button id="lbP" aria-label="Anterior">‹</button><button id="lbN" aria-label="Siguiente">›</button></div>

<main>
  <!-- 1 · Portada -->
  <section class="scene paper first" id="hero">
    <div class="stage"><img class="sbg" id="ph-portada" alt="" fetchpriority="high"><div class="shade"></div></div>
    <div class="layer">
      <div class="hero-txt" data-fx="out">
        <p class="over" data-a="up" data-d=".1" data-i="nosCasamos"></p>
        <div><span class="script hn" id="n1" data-a="write" data-d=".5"></span><span class="hamp" data-a="blur" data-d="1.2">&amp;</span><span class="script hn" id="n2" data-a="write" data-d="1.4"></span></div>
        <div class="hline" data-a="blur" data-d="2"></div>
        <p class="cz" id="heroShort" data-a="up" data-d="2.2" style="margin:0;font-size:15px;letter-spacing:.3em"></p>
        <p class="sample" data-a="up" data-d="2.5" data-i="sample"></p>
      </div>
      <div class="cue" data-a="up" data-d="2.8"><span data-i="desliza"></span><i></i></div>
    </div>
  </section>

  <!-- 2 · Bienvenida -->
  <section class="sec paper" id="intro">
    <div class="corner tr" data-orn="1"></div><div class="corner bl" data-orn="2"></div>
    <div class="wrap">
      <div data-fx><p class="over" data-i="ovBien"></p><h2 data-i="amorT"></h2><svg class="flour"><use href="#flour"/></svg></div>
      <p class="guestline" id="introGuest" data-fx></p>
      <p class="lead" id="bienv" data-fx></p>
      <div class="pol" id="pol" data-fx></div>
      <p class="sign script" id="sign" data-fx></p>
    </div>
  </section>

  <!-- 3 · Cuenta regresiva sobre foto -->
  <section class="scene dark" id="sc-count">
    <div class="stage"><img class="sbg" id="ph-frase" alt="" fetchpriority="low"><div class="shade"></div></div>
    <div class="layer">
      <div class="wrap">
        <div class="cbox glass arch" data-fx>
          <p class="over" style="color:var(--lgold)" id="countOver"></p>
          <p class="cn" id="cNames"></p>
          <div class="count" aria-live="off">
            <div><b id="cd-d">0</b><span data-i="dias"></span></div><div><b id="cd-h">0</b><span data-i="horas"></span></div>
            <div><b id="cd-m">0</b><span data-i="minutos"></span></div><div><b id="cd-s">0</b><span data-i="segundos"></span></div>
          </div>
          <div class="vline"></div>
          <p class="quote" id="frase"></p>
          <p style="font-style:italic;font-size:22px;margin:0 0 18px" id="cDate"></p>
          <a class="btn" id="calBtn" target="_blank" rel="noopener" data-i="addCal"></a>
        </div>
      </div>
    </div>
  </section>

  <!-- 4 · Nombramientos -->
  <section class="sec dark">
    <div class="corner tl" data-orn="3"></div><div class="corner br" data-orn="4"></div>
    <div class="wrap">
      <div data-fx><p class="over" data-i="ovFam"></p><h2 data-i="bendicion"></h2><svg class="flour"><use href="#flour"/></svg></div>
      <div class="fam arch" id="people" data-fx></div>
    </div>
  </section>

  <!-- 5 · Dónde -->
  <section class="sec paper">
    <div class="corner tr" data-orn="5"></div>
    <div class="wrap">
      <div data-fx><p class="over" data-i="ovCel"></p><h2 data-i="donde"></h2><svg class="flour"><use href="#flour"/></svg></div>
      <div class="cards" id="lugares"></div>
    </div>
  </section>

  <!-- 6 · Itinerario + información sobre foto -->
  <section class="scene dark" id="sc-itin">
    <div class="stage"><img class="sbg" id="ph-itinerario" alt="" fetchpriority="low" style="object-position:30% 40%"><div class="shade"></div></div>
    <div class="layer">
      <div class="wrap" style="max-width:1240px">
        <div class="itin glass" data-fx>
          <p class="over" style="color:var(--lgold)" data-i="ovDia"></p><h2 style="color:#fbf5ec" data-i="itin"></h2>
          <ol class="tl" id="sched"></ol>
        </div>
        <div class="info glass light" data-fx>
          <p class="over" data-i="ovAntes"></p><h2 data-i="info"></h2>
          <div id="info" style="border:0;padding:0"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- 7 · Vestimenta sobre foto -->
  <section class="scene dunebg" id="sc-dress">
    <div class="stage"><img class="sbg" id="ph-vestimenta" alt="" fetchpriority="low"><div class="shade" style="background:linear-gradient(#20160f33,#20160f1a 40%,#20160f66)"></div></div>
    <div class="layer">
      <div class="wrap">
        <div class="dressbox glass light arch" data-fx>
          <p class="over" data-i="ovRopa"></p><h2 data-i="vest"></h2><svg class="flour"><use href="#flour"/></svg>
          <p class="cz" id="dressTitle" style="font-size:17px;letter-spacing:.3em;margin:0 0 8px"></p>
          <p class="muted" id="dressNote" style="font-style:italic;margin:0"></p>
          <div class="dress" id="dressColors"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- 8 · Menú -->
  <section class="sec dunebg">
    <div class="corner tl" data-orn="6"></div><div class="corner br" data-orn="7"></div>
    <div class="wrap">
      <div data-fx><p class="over" data-i="ovCena"></p><h2 data-i="menu"></h2><svg class="flour"><use href="#flour"/></svg></div>
      <div class="menu-card" data-fx><ul class="menu" id="menu"></ul></div>
    </div>
  </section>

  <!-- 9 · Hospedaje -->
  <section class="sec paper">
    <div class="corner tr" data-orn="8"></div>
    <div class="wrap">
      <div data-fx><p class="over" data-i="ovFuera"></p><h2 data-i="hosp"></h2><svg class="flour"><use href="#flour"/></svg></div>
      <p class="lead muted" id="hospNote" data-fx></p>
      <div class="cards" id="hoteles" style="margin-top:30px"></div>
    </div>
  </section>

  <!-- 10 · Regalos -->
  <section class="sec dunebg">
    <div class="corner tl" data-orn="9"></div>
    <div class="wrap">
      <div data-fx><p class="over" data-i="ovDetalle"></p><h2 data-i="regalos"></h2><svg class="flour"><use href="#flour"/></svg></div>
      <p class="lead muted" id="giftNote" data-fx></p>
      <div class="cards" id="gifts" style="margin-top:30px"></div>
    </div>
  </section>

  <!-- 11 · Confirmación sobre foto -->
  <section class="scene paper" id="rsvp">
    <div class="stage"><img class="sbg" id="ph-rsvp" alt="" fetchpriority="low"><div class="shade" style="background:linear-gradient(#20160f4d,#20160f26 40%,#20160f80)"></div></div>
    <div class="layer">
      <div class="wrap">
        <div class="rsvpbox glass light arch" data-fx>
          <p class="over" data-i="ovLugar"></p><h2 data-i="rsvp"></h2><svg class="flour"><use href="#flour"/></svg>
          <p class="muted" id="rsvpLimit" style="margin-top:0"></p>
          <p class="adults" id="adultsNote" hidden></p>
          <div class="pass" id="pass" hidden></div>
          <form id="rsvpForm" novalidate>
            <label><span data-i="nombre"></span><input id="fNombre" required autocomplete="name"></label>
            <div class="radios" role="radiogroup">
              <label><input type="radio" name="asis" value="si" checked> <span data-i="si"></span></label>
              <label><input type="radio" name="asis" value="no"> <span data-i="no"></span></label>
            </div>
            <div class="two" id="countFields">
              <label><span data-i="adultos"></span><select id="fAdultos"></select></label>
              <label><span data-i="ninos"></span><select id="fNinos"></select></label>
            </div>
            <label><span data-i="msg"></span><textarea id="fMsg" rows="3"></textarea></label>
            <button class="btn solid" type="submit" data-i="enviar"></button>
            <p id="rsvpOut" class="muted" aria-live="polite"></p>
          </form>
        </div>
      </div>
    </div>
  </section>

  <!-- 12 · Compartir -->
  <section class="sec paper">
    <div class="corner tl" data-orn="10"></div><div class="corner br" data-orn="11"></div>
    <div class="wrap" style="max-width:1080px">
      <div data-fx><p class="over" data-i="ovMom"></p><h2 data-i="compartir"></h2><svg class="flour"><use href="#flour"/></svg></div>
      <div class="cards">
        <div class="card" data-fx><svg class="ico"><use href="#i-cam"/></svg><p class="over" style="margin:8px 0 0" data-i="hashT"></p><p class="tag" id="tag"></p><p class="muted" style="margin:0;font-style:italic" data-i="shareTxt"></p><button class="btn" id="copyTag" type="button" data-i="copiarTag"></button></div>
        <div class="card" data-fx><svg class="ico"><use href="#i-album"/></svg><p class="over" style="margin:8px 0 0" data-i="albumT"></p><p class="muted" style="margin:0;font-style:italic" data-i="albumTxt"></p><a class="btn" id="grupo" target="_blank" rel="noopener" data-i="grupo"></a></div>
        <div class="card" data-fx><svg class="ico"><use href="#i-music"/></svg><p class="over" style="margin:8px 0 0" data-i="cancionT"></p><p class="muted" style="margin:0;font-style:italic" data-i="cancionTxt"></p>
          <form class="song" id="songForm" novalidate><input id="fSong" aria-label="Canción" autocomplete="off"><button class="btn solid" type="submit" data-i="sugerir"></button></form>
          <p id="songOut" class="muted" aria-live="polite"></p></div>
      </div>
    </div>
  </section>

  <!-- 12b · Galería (última sección antes del cierre): fotos impresas que entran de izquierda y derecha -->
  <section class="sec paper" id="galeria" style="padding-bottom:clamp(140px,18vw,200px)">
    <div class="corner tr" data-orn="12"></div><div class="corner bl" data-orn="13"></div>
    <div class="wrap">
      <div data-fx style="position:relative;z-index:3;margin-bottom:24px"><p class="over" data-i="ovGal"></p><h2 data-i="galT"></h2><svg class="flour"><use href="#flour"/></svg></div>
      <div class="prints" id="prints"></div>
    </div>
  </section>

  <!-- 13 · Cierre -->
  <section class="scene last" id="cierre">
    <div class="stage"><img class="sbg" id="ph-cierre" alt="" fetchpriority="low"><div class="shade"></div></div>
    <div class="layer">
      <div>
        <p style="margin:0 0 6px;font-style:italic;font-size:24px" data-a="up" data-i="teEsperamos"></p>
        <span class="script" id="footNames" data-a="write" data-d=".3"></span>
        <p class="cz" style="margin:10px 0 0;opacity:.9;font-size:15px;letter-spacing:.3em" id="footDate" data-a="up" data-d=".8"></p>
      </div>
    </div>
  </section>
</main>

<script src="js/config.js"></script>
<script src="js/fotos-previa.js"></script>
<script src="js/textos.js"></script>
<script src="js/app.js"></script>
</body>
</html>
